quarkus.http.port=8080
quarkus.http.host=0.0.0.0

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:admin}
quarkus.datasource.password=${DB_PASSWORD:changeme}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/skillgateway}

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.smallrye-health.root-path=/q/health
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-api-key
quarkus.http.limits.max-body-size=${HTTP_MAX_BODY_SIZE:12M}

auth.api-key=${AUTH_API_KEY:dev-api-key}

skill.bundle.storage-root=${SKILL_BUNDLE_STORAGE_ROOT:target/skill-bundles}
skill.bundle.max-bytes=${SKILL_BUNDLE_MAX_BYTES:10485760}
skill.bundle.max-file-bytes=${SKILL_BUNDLE_MAX_FILE_BYTES:1048576}
skill.bundle.max-files=${SKILL_BUNDLE_MAX_FILES:200}

ai.embedding.provider=${AI_EMBEDDING_PROVIDER:ollama}
ai.embedding.url=${AI_EMBEDDING_URL:http://localhost:11434/api/embeddings}
ai.embedding.model=${AI_EMBEDDING_MODEL:nomic-embed-text}
ai.embedding.api-key=${AI_EMBEDDING_API_KEY:}
ai.embedding.dimension=${AI_EMBEDDING_DIMENSION:768}
ai.embedding.timeout-seconds=${AI_EMBEDDING_TIMEOUT_SECONDS:3}

search.weight.keyword=0.3
search.weight.semantic=0.5
search.weight.popularity=0.2
search.default-limit=20
search.max-limit=50
